<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阳明谷</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 40px 80px;
    }

    h1 {
      font-size: 64px;
      margin: 0 0 10px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 24px;
      color: #555;
      margin-bottom: 50px;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 42px;
    }

    .book-item {
      text-decoration: none;
      color: inherit;
    }

    .book {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: linear-gradient(180deg, #2c4da0, #1d2f73);
    }

    .book:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.18);
    }

    .book::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 22px;
      height: 100%;
      background: rgba(255,255,255,0.18);
    }

    .book-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 28px 30px 34px;
      color: white;
    }

    .book-title {
      font-size: 28px;
      line-height: 1.15;
      font-weight: 800;
      text-transform: uppercase;
      word-break: break-word;
    }

    .book-footer {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .book-name {
      text-align: center;
      margin-top: 16px;
      font-size: 20px;
      font-weight: 700;
    }

    .book-desc {
      text-align: center;
      margin-top: 6px;
      color: #666;
      font-size: 16px;
    }

    .footer {
      text-align: center;
      margin-top: 80px;
      color: #888;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>阳明谷</h1>
    <div class="subtitle">My mathematical notes library</div>

    <div id="bookshelf" class="bookshelf"></div>

    <div class="footer">Built with GitHub Pages · Updated by GitHub Actions</div>
  </div>

  <script>
    const colors = [
      ["#2c4da0", "#1d2f73"],
      ["#8d1f3d", "#5d1025"],
      ["#4e7c51", "#284d2a"],
      ["#8a6419", "#5b3d0b"],
      ["#5d4e9e", "#34296e"],
      ["#00796b", "#004d40"],
      ["#6d4c41", "#3e2723"]
    ];

    function formatTitle(name) {
      return name
        .replace(/^dx[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function formatUpperSpine(name) {
      return formatTitle(name).replace(/ /g, "<br>");
    }

    async function loadBooks() {
      const res = await fetch("books.json");
      const books = await res.json();

      const shelf = document.getElementById("bookshelf");
      shelf.innerHTML = "";

      books.forEach((book, i) => {
        const color = colors[i % colors.length];
        const title = book.title || formatTitle(book.file);
        const spine = formatUpperSpine(book.file.replace(/\.pdf$/i, ""));
        const desc = book.desc || "Auto-compiled from LaTeX";
        const href = `pdf/${book.file}`;

        const a = document.createElement("a");
        a.className = "book-item";
        a.href = href;
        a.target = "_blank";

        a.innerHTML = `
          <div class="book" style="background: linear-gradient(180deg, ${color[0]}, ${color[1]});">
            <div class="book-content">
              <div class="book-title">${spine}</div>
              <div class="book-footer">
                ${desc}<br>
                Click to open PDF
              </div>
            </div>
          </div>
          <div class="book-name">${title}</div>
          <div class="book-desc">${book.subtitle || ""}</div>
        `;

        shelf.appendChild(a);
      });
    }

    loadBooks();
  </script>
</body>
</html>
