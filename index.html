<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阳明谷</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 40px 80px;
    }

    h1 {
      font-size: 64px;
      margin: 0 0 10px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 24px;
      color: #555;
      margin-bottom: 28px;
    }

    .search-wrap {
      max-width: 900px;
      margin: 0 auto 42px;
      position: relative;
    }

    .search-shell {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 24px;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.08),
        0 2px 10px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    .search-shell.focused {
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.12),
        0 4px 16px rgba(0, 0, 0, 0.06);
      transform: translateY(-1px);
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
    }

    .search-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      opacity: 0.55;
    }

    .search-input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 22px;
      color: #111;
      line-height: 1.4;
    }

    .search-input::placeholder {
      color: #888;
    }

    .search-meta {
      padding: 0 20px 16px;
      font-size: 14px;
      color: #777;
    }

    .search-results {
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      display: none;
      max-height: 560px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.9);
    }

    .search-results.show {
      display: block;
    }

    .result-empty {
      padding: 22px 20px 26px;
      color: #666;
      font-size: 15px;
    }

    .result-item {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      transition: background 0.18s ease;
    }

    .result-item:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    .result-type {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .result-meta {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .preview-body mark {
      background: #ffeaa7;
      color: inherit;
      padding: 0 2px;
      border-radius: 4px;
    }

    .preview-card {
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .preview-card.tip {
      background: #faf7ff;
      border-left: 6px solid #7c4dff;
    }

    .preview-card.definition {
      background: #fffdf7;
      border-left: 6px solid #d4a017;
    }

    .preview-card.theorem {
      background: #f7fbff;
      border-left: 6px solid #2f6fed;
    }

    .preview-card.example {
      background: #f7fff8;
      border-left: 6px solid #2e8b57;
    }

    .preview-card.note {
      background: #fffaf5;
      border-left: 6px solid #cc7a00;
    }

    .preview-card.homework {
      background: #fff8f8;
      border-left: 6px solid #c43d3d;
    }

    .preview-card.solution {
      background: #f8fffb;
      border-left: 6px solid #1d8f5a;
    }

    .preview-card.text {
      background: #ffffff;
      border-left: 6px solid #bdbdbd;
    }

    .preview-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.72;
      margin-bottom: 8px;
    }

    .preview-body {
      font-size: 15px;
      line-height: 1.8;
      color: #333;
      white-space: pre-wrap;
    }

    .preview-image {
      width: 100%;
      display: block;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: white;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 42px;
    }

    .book-item {
      text-decoration: none;
      color: inherit;
    }

    .book {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: linear-gradient(180deg, #2c4da0, #1d2f73);
    }

    .book:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.18);
    }

    .book::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 22px;
      height: 100%;
      background: rgba(255,255,255,0.18);
    }

    .book-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 28px 30px 34px;
      color: white;
    }

    .book-title {
      font-size: 28px;
      line-height: 1.15;
      font-weight: 800;
      text-transform: uppercase;
      word-break: break-word;
    }

    .book-footer {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .book-name {
      text-align: center;
      margin-top: 16px;
      font-size: 20px;
      font-weight: 700;
    }

    .book-desc {
      text-align: center;
      margin-top: 6px;
      color: #666;
      font-size: 16px;
    }

    .footer {
      text-align: center;
      margin-top: 80px;
      color: #888;
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 26px 18px 56px;
      }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 18px;
        margin-bottom: 20px;
      }

      .search-bar {
        padding: 15px 16px;
      }

      .search-input {
        font-size: 18px;
      }

      .result-title {
        font-size: 17px;
      }

      .bookshelf {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>阳明谷</h1>
    <div class="subtitle">My mathematical notes library</div>

    <div class="search-wrap">
      <div id="searchShell" class="search-shell">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 21L16.65 16.65M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="搜索笔记内容，例如 Real Analysis"
            autocomplete="off"
          />
        </div>
        <div id="searchMeta" class="search-meta">输入关键词后会在索引中精确匹配</div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <div id="bookshelf" class="bookshelf"></div>

    <div class="footer">Built with GitHub Pages · Updated by GitHub Actions</div>
  </div>

<script>
  const colors = [
    ["#2c4da0", "#1d2f73"],
    ["#8d1f3d", "#5d1025"],
    ["#4e7c51", "#284d2a"],
    ["#8a6419", "#5b3d0b"],
    ["#5d4e9e", "#34296e"],
    ["#00796b", "#004d40"],
    ["#6d4c41", "#3e2723"]
  ];

  let searchIndex = [];

  function formatTitle(name) {
    return name
      .replace(/^dx[-_]?/i, "")
      .replace(/[-_]/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function formatUpperSpine(name) {
    return formatTitle(name).replace(/ /g, "<br>");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function countOccurrences(text, query) {
    if (!text || !query) return 0;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const matches = text.toLowerCase().match(new RegExp(escaped, "g"));
    return matches ? matches.length : 0;
  }

  function makeSnippet(content, query, radius = 60) {
    if (!content) return "";
    const lower = content.toLowerCase();
    const q = query.toLowerCase();
    const index = lower.indexOf(q);

    if (index === -1) {
      return escapeHtml(content.slice(0, radius * 2).trim());
    }

    const start = Math.max(0, index - radius);
    const end = Math.min(content.length, index + q.length + radius);

    let snippet = content.slice(start, end).trim();
    if (start > 0) snippet = "..." + snippet;
    if (end < content.length) snippet = snippet + "...";

    const escaped = escapeHtml(snippet);
    const matchedText = snippet.slice(
      Math.max(0, index - start),
      Math.max(0, index - start) + q.length
    );
    const safeQuery = escapeHtml(matchedText);

    return escaped.replace(
      new RegExp(safeQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"),
      "<mark>$&</mark>"
    );
  }

  function scoreItem(item, query) {

    const textHits = countOccurrences(item.text || "", query);

    let score = 0;

    score += textHits * 10;

    if ((item.kind || "") === "definition") {
      score += 100000;
    }

    return score;
  }

  function searchNotes(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];

    return searchIndex
      .map(item => {
        const score = scoreItem(item, q);
        if (score <= 0) return null;

        return {
          ...item,
          score,
          snippet: makeSnippet(item.text || item.blockTitle || "", q)
        };
      })
      .filter(Boolean)
      .sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return String(a.id || "").localeCompare(String(b.id || ""));
      })
      .slice(0, 12);
  }

  function renderSearchResults(query) {
    const meta = document.getElementById("searchMeta");
    const box = document.getElementById("searchResults");

    if (!query.trim()) {
      box.classList.remove("show");
      box.innerHTML = "";
      meta.textContent = "输入关键词后会在索引中精确匹配";
      return;
    }

    const results = searchNotes(query);
    box.classList.add("show");

    if (results.length === 0) {
      meta.textContent = "没有找到匹配结果";
      box.innerHTML = `
        <div class="result-empty">
          没有找到和 “${escapeHtml(query)}” 对应的内容。
        </div>
      `;
      return;
    }

    meta.textContent = `找到 ${results.length} 条结果`;

    box.innerHTML = results.map(item => {
      const title =
        item.previewTitle ||
        item.blockTitle ||
        item.title ||
        "Untitled";

      const metaText = [item.title].filter(Boolean).join(" · ");

      const page = item.pdfLocator && item.pdfLocator.page ? item.pdfLocator.page : 1;
      const href = item.pdf ? `${item.pdf}#page=${page}` : "#";
      const previewClass = `preview-card ${item.previewType || "text"}`;

      const previewHtml = item.previewImage
        ? `<img class="preview-image" src="${escapeHtml(item.previewImage)}" alt="${escapeHtml(title)}" />`
        : `<div class="${escapeHtml(previewClass)}"><div class="preview-label">${escapeHtml(item.previewTitle || title)}</div><div class="preview-body">${item.snippet}</div></div>`;

      return `
        <a class="result-item" href="${escapeHtml(href)}" target="_blank" rel="noreferrer">
          <div class="result-type">${escapeHtml(item.kind || "text")}</div>
          <div class="result-title">${escapeHtml(title)}</div>
          <div class="result-meta">${escapeHtml(metaText)} · 第 ${escapeHtml(String(page))} 页</div>
          ${previewHtml}
        </a>
      `;
    }).join("");
  }

  async function loadBooks() {
    const res = await fetch("books.json");
    const books = await res.json();

    const shelf = document.getElementById("bookshelf");
    shelf.innerHTML = "";

    books.forEach((book, i) => {
      const color = colors[i % colors.length];
      const title = book.title || formatTitle(book.file);
      const spine = formatUpperSpine(book.file.replace(/\.pdf$/i, ""));
      const desc = book.desc || "Auto-compiled from LaTeX";
      const href = `pdf/${book.file}`;

      const a = document.createElement("a");
      a.className = "book-item";
      a.href = href;
      a.target = "_blank";

      a.innerHTML = `
        <div class="book" style="background: linear-gradient(180deg, ${color[0]}, ${color[1]});">
          <div class="book-content">
            <div class="book-title">${spine}</div>
            <div class="book-footer">
              ${desc}<br>
              Click to open PDF
            </div>
          </div>
        </div>
        <div class="book-name">${title}</div>
        <div class="book-desc">${book.subtitle || ""}</div>
      `;

      shelf.appendChild(a);
    });
  }

  async function loadSearchIndex() {
    try {
      const res = await fetch("./public/search-index.previews.json");
      if (!res.ok) {
        throw new Error("search-index.previews.json not found");
      }
      searchIndex = await res.json();
    } catch (error) {
      console.error("[search] Failed to load search-index.previews.json", error);
      searchIndex = [];
    }
  }

  function bindSearchEvents() {
    const input = document.getElementById("searchInput");
    const shell = document.getElementById("searchShell");

    input.addEventListener("focus", () => {
      shell.classList.add("focused");
    });

    input.addEventListener("blur", () => {
      shell.classList.remove("focused");
    });

    input.addEventListener("input", (e) => {
      renderSearchResults(e.target.value);
    });

    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        input.focus();
      }
    });
  }

  async function init() {
    await Promise.all([loadBooks(), loadSearchIndex()]);
    bindSearchEvents();
  }

  init();
</script>
</body>
</html>
