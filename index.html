<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阳明谷</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f3f3f3;
    color: #222;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 40px 80px;
    position: relative;
  }

  h1 {
    font-size: 64px;
    margin: 0 0 20px;
    font-weight: 800;
    font-family: "Ma Shan Zheng", cursive;
  }

  .subtitle {
    font-size: 24px;
    color: #555;
    margin-bottom: 18px;
    font-family: "Ma Shan Zheng", cursive;
    line-height: 1.9;
  }

  .search-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 49px 0 42px;
  }

  .admin-bar {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .admin-btn.video-btn {
    background: #1a6fd4;
  }

  .admin-btn.video-btn:hover {
    background: #1558b0;
  }

  .video-thumb-wrap {
    position: relative;
    background: #000;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    cursor: pointer;
  }

  .video-thumb-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .video-play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    transition: background 0.2s;
  }

  .video-thumb-wrap:hover .video-play-icon {
    background: rgba(0, 0, 0, 0.32);
  }

  .video-play-icon::after {
    content: none;
  }

  .video-viewer {
    display: none;
  }

  .video-viewer-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .video-back-btn {
    background: none;
    border: none;
    font-size: 14px;
    cursor: pointer;
    color: #1a6fd4;
    padding: 0;
    white-space: nowrap;
  }

  .video-back-btn:hover {
    text-decoration: underline;
  }

  .video-viewer-name {
    font-size: 18px;
    font-weight: 600;
    color: #222;
  }

  .video-viewer video {
    width: 100%;
    border-radius: 12px;
    background: #000;
    display: block;
  }

  .video-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 1000;
    overflow-y: auto;
    padding: 40px 20px;
  }

  .video-modal.open {
    display: block;
  }

  .video-modal-inner {
    max-width: 1100px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    position: relative;
  }

  .video-modal-title {
    margin: 0 0 20px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
  }

  .video-modal-close {
    position: absolute;
    top: 16px;
    left: 20px;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #888;
    line-height: 1;
  }

  .video-modal-close:hover {
    color: #222;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .video-card {
    background: #f5f5f5;
    border-radius: 12px;
    overflow: hidden;
  }

  .video-card video {
    width: 100%;
    display: block;
  }

  .video-card-name {
    padding: 8px 12px 10px;
    font-size: 13px;
    color: #555;
    text-align: center;
  }

  @media (max-width: 900px) {
    .video-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 500px) {
    .video-grid { grid-template-columns: 1fr; }
    .video-modal-inner { padding: 20px 16px; }
  }

  .admin-btn {
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    background: #111;
    color: #fff;
    white-space: nowrap;
    transition: background 0.25s ease, transform 0.15s ease;
  }

  .admin-btn.active {
    background: #6b4fa0;
  }


  .admin-btn:hover {
    transform: scale(1.04);
  }

  .hero-wrap {
    position: absolute;
    top: 5px;
    right: 260px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .hero-carousel {
    width: 460px;
    height: 250px;
    overflow: hidden;
    border-radius: 24px;
    background: #111;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
  }

  .hero-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.5s ease;
  }

  .hero-slide {
    flex: 0 0 100%;
    min-width: 100%;
    height: 100%;
  }

  .hero-slide video,
  .hero-carousel > video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #111;
  }

  .hero-dots {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hero-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .hero-dot.active {
    background: #fff;
    transform: scale(1.35);
  }

  .hero-dot:hover {
    background: rgba(255, 255, 255, 0.8);
  }

  .hero-carousel {
    cursor: pointer;
  }

  .search-wrap {
    position: relative;
    z-index: 20;
    flex: 1;
    max-width: 900px;
  }

  .search-shell {
    position: relative;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 24px;
    box-shadow:
      0 10px 35px rgba(0, 0, 0, 0.08),
      0 2px 10px rgba(0, 0, 0, 0.04);
    overflow: visible;
    transition: box-shadow 0.25s ease, transform 0.25s ease;
  }

  .search-shell.focused {
    box-shadow:
      0 18px 45px rgba(0, 0, 0, 0.12),
      0 4px 16px rgba(0, 0, 0, 0.06);
    transform: translateY(-1px);
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
  }

  .search-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    opacity: 0.55;
  }

  .search-input {
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    font-size: 22px;
    color: #111;
    line-height: 1.4;
  }

  .search-input::placeholder {
    color: #888;
  }

  .search-meta {
    padding: 0 20px 16px;
    font-size: 14px;
    color: #777;
  }

  .search-meta:empty {
    display: none;
  }

  .search-results {
    position: absolute;
    top: calc(100% + 12px);
    left: 0;
    right: 0;
    z-index: 30;
    display: none;
    max-height: 560px;
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.93);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 24px;
    box-shadow:
      0 22px 50px rgba(0, 0, 0, 0.12),
      0 6px 20px rgba(0, 0, 0, 0.06);
  }

  .search-results.show {
    display: block;
  }

  .result-empty {
    padding: 22px 20px 26px;
    color: #666;
    font-size: 15px;
  }

  .result-item {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 18px 20px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    transition: background 0.18s ease;
  }

  .result-item:hover {
    background: rgba(0, 0, 0, 0.03);
  }

  .result-type {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 8px;
  }

  .result-title {
    font-size: 20px;
    font-weight: 700;
    color: #111;
    margin-bottom: 6px;
    line-height: 1.35;
  }

  .result-meta {
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .preview-body {
    font-size: 15px;
    line-height: 1.8;
    color: #333;
    white-space: pre-wrap;
  }

  .preview-body mark {
    background: #ffeaa7;
    color: inherit;
    padding: 0 2px;
    border-radius: 4px;
  }

  .preview-image {
    width: 100%;
    display: block;
    background: white;
  }

  .bookshelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 42px;
    transition: filter 0.25s ease, opacity 0.25s ease, transform 0.25s ease;
  }

  .bookshelf.dimmed {
    filter: blur(6px);
    opacity: 0.42;
    transform: scale(1.01);
    pointer-events: none;
  }

  .book-item {
    text-decoration: none;
    color: inherit;
  }

  .book {
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    background: linear-gradient(180deg, #2c4da0, #1d2f73);
  }

  .book:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 22px 40px rgba(0,0,0,0.22);
  }

  .book::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 22px;
    height: 100%;
    background: rgba(255,255,255,0.18);
  }

  .book-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 28px 30px 34px;
    color: white;
  }

  .book-title {
    font-size: 22px;
    line-height: 1.25;
    font-weight: 800;
    text-transform: uppercase;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
  }

  .book-footer {
    font-size: 18px;
    line-height: 1.6;
    opacity: 0.95;
  }

  .book-name {
    text-align: center;
    margin-top: 16px;
    font-size: 20px;
    font-weight: 700;
  }

  .book-desc {
    text-align: center;
    margin-top: 6px;
    color: #666;
    font-size: 16px;
  }

  .footer {
    text-align: center;
    margin-top: 80px;
    color: #888;
    font-size: 15px;
  }

  @media (max-width: 1200px) {
    .admin-bar {
      padding-right: 0;
    }

    .hero-wrap {
      position: static;
      width: 100%;
      margin-bottom: 20px;
      gap: 10px;
    }

    .hero-carousel {
      flex: 1;
      height: 240px;
    }

    .search-wrap {
      margin-top: 0;
    }
  }

  @media (max-width: 768px) {
    .container {
      padding: 26px 18px 56px;
    }


    h1 {
      font-size: 42px;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .search-bar {
      padding: 15px 16px;
    }

    .search-input {
      font-size: 18px;
    }

    .result-title {
      font-size: 17px;
    }

    .bookshelf {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
    }
  }
 </style>
</head>
<body>
  <div class="container">
    <h1>阳明谷</h1>
    <div class="subtitle">躲天意，避因果，诸般枷锁困真我。<br>顺天意，承因果，今日方知我是我。</div>

    <div class="hero-wrap">
      <div class="hero-carousel" id="heroCarousel">
        <div class="hero-track" id="heroTrack">
          <div class="hero-slide">
            <video src="video/1.mp4" muted playsinline preload="auto"></video>
          </div>
          <div class="hero-slide">
            <video src="video/2.mp4" muted playsinline preload="auto"></video>
          </div>
          <div class="hero-slide">
            <video src="video/3.mp4" muted playsinline preload="auto"></video>
          </div>
          <div class="hero-slide">
            <video src="video/4.mp4" muted playsinline preload="auto"></video>
          </div>
        </div>
      </div>
      <div class="hero-dots" id="heroDots"></div>
    </div>

    <div class="search-row">
      <div class="admin-bar">
        <button id="adminBtn" class="admin-btn" onclick="toggleAdmin()">管理员登录</button>
        <button class="admin-btn video-btn" onclick="openVideoGallery()">视频</button>
      </div>
      <div class="search-wrap">
        <div id="searchShell" class="search-shell">
          <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 21L16.65 16.65M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input
              id="searchInput"
              class="search-input"
              type="text"
              placeholder="搜索笔记内容，例如 Real Analysis"
              autocomplete="off"
            />
          </div>
          <div id="searchMeta" class="search-meta"></div>
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>
      <button id="tasksBtn" class="admin-btn" onclick="window.location.href='https://yangminggu.com/tasks'" style="display:none">Tasks</button>
    </div>

    <div id="bookshelf" class="bookshelf"></div>
    <div class="footer">Built with GitHub Pages · Updated by GitHub Actions</div>
  </div>

  <div id="videoModal" class="video-modal" onclick="if(event.target===this)closeVideoGallery()">
    <div class="video-modal-inner">
      <button class="video-modal-close" onclick="closeVideoGallery()">✕</button>

      <div id="videoGallery">
        <div class="video-modal-title">数学可视化</div>
        <div id="videoGrid" class="video-grid"></div>
      </div>

      <div id="videoViewer" class="video-viewer">
        <div class="video-viewer-header">
          <button class="video-back-btn" onclick="closeVideoViewer()">← 返回</button>
          <span id="viewerName" class="video-viewer-name"></span>
        </div>
        <video id="viewerVideo" controls></video>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "ymglbk";
    const colors = [
      ["#2c4da0", "#1d2f73"],
      ["#8d1f3d", "#5d1025"],
      ["#4e7c51", "#284d2a"],
      ["#8a6419", "#5b3d0b"],
      ["#5d4e9e", "#34296e"],
      ["#00796b", "#004d40"],
      ["#6d4c41", "#3e2723"]
    ];

    let searchIndex = [];
    let visibilityMap = {};
    let isAdmin = localStorage.getItem("isAdmin") === "true";

    function updateAdminBtn() {
      const btn = document.getElementById("adminBtn");
      const tasksBtn = document.getElementById("tasksBtn");
      if (!btn) return;
      if (isAdmin) {
        btn.textContent = "已登录";
        btn.classList.add("active");
        if (tasksBtn) tasksBtn.style.display = "";
      } else {
        btn.textContent = "管理员";
        btn.classList.remove("active");
        if (tasksBtn) tasksBtn.style.display = "none";
      }
    }

    function canViewRepo(repo) {
      return isAdmin || visibilityMap[repo] !== false;
    }

    async function loadVisibility() {
      try {
        const res = await fetch("/visibility.json");
        if (!res.ok) throw new Error("visibility.json not found");
        visibilityMap = await res.json();
      } catch (error) {
        console.error("[visibility] Failed to load visibility.json", error);
        visibilityMap = {};
      }
    }

    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        localStorage.removeItem("isAdmin");
        location.reload();
      } else {
        const pwd = prompt("请输入管理员密码");
        if (pwd === ADMIN_PASSWORD) {
          isAdmin = true;
          localStorage.setItem("isAdmin", "true");
          location.reload();
        } else if (pwd !== null) {
          alert("密码错误");
        }
      }
    }

    let videosLoaded = false;
    let videoData = [];

    async function openVideoGallery() {
      const modal = document.getElementById("videoModal");
      const grid = document.getElementById("videoGrid");

      document.getElementById("videoGallery").style.display = "block";
      document.getElementById("videoViewer").style.display = "none";

      if (!videosLoaded) {
        try {
          const resp = await fetch("video/videos.json");
          videoData = await resp.json();
          grid.innerHTML = videoData.map((v, i) => `
            <div class="video-card" onclick="openVideoViewer(${i})">
              <div class="video-thumb-wrap">
                <video class="video-thumb-video" id="thumb-${i}" src="${v.file}" muted preload="metadata"></video>
                <div class="video-play-icon"></div>
              </div>
              <div class="video-card-name">${v.name}</div>
            </div>
          `).join("");
          videoData.forEach((_, i) => {
            const vid = document.getElementById(`thumb-${i}`);
            vid.addEventListener("loadedmetadata", () => {
              vid.currentTime = Math.min(3, vid.duration - 0.1);
            });
          });
          videosLoaded = true;
        } catch (e) {
          grid.innerHTML = "<p style='color:#888;padding:16px'>暂无视频</p>";
        }
      }

      modal.classList.add("open");
    }

    function openVideoViewer(index) {
      const v = videoData[index];
      const viewer = document.getElementById("videoViewer");
      const viewerVideo = document.getElementById("viewerVideo");
      document.getElementById("viewerName").textContent = v.name;
      viewerVideo.muted = false;
      viewerVideo.src = v.file;
      document.getElementById("videoGallery").style.display = "none";
      viewer.style.display = "block";
    }

    function closeVideoViewer() {
      const viewerVideo = document.getElementById("viewerVideo");
      viewerVideo.pause();
      viewerVideo.src = "";
      document.getElementById("videoViewer").style.display = "none";
      document.getElementById("videoGallery").style.display = "block";
    }

    function closeVideoGallery() {
      const viewerVideo = document.getElementById("viewerVideo");
      viewerVideo.pause();
      viewerVideo.src = "";
      document.getElementById("videoModal").classList.remove("open");
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeVideoGallery();
    });

    function formatTitle(name) {
      return name
        .replace(/^dx[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function formatUpperSpine(name) {
      return formatTitle(name);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 文本归一化：小写 + 全角转半角（含全角空格），统一中英文 / 全半角输入
    function normalizeText(str) {
      if (!str) return "";
      return String(str)
        .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/　/g, " ")
        .toLowerCase();
    }

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function isLatinToken(tok) {
      return /^[a-z0-9]+$/.test(tok);
    }

    // 编辑距离是否 ≤ maxDist（逐行剪枝），用于英文术语拼写容错
    function withinEditDistance(a, b, maxDist) {
      const la = a.length, lb = b.length;
      if (Math.abs(la - lb) > maxDist) return false;
      let prev = Array.from({ length: lb + 1 }, (_, j) => j);
      for (let i = 1; i <= la; i++) {
        const cur = [i];
        let rowBest = i;
        for (let j = 1; j <= lb; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
          if (cur[j] < rowBest) rowBest = cur[j];
        }
        if (rowBest > maxDist) return false;
        prev = cur;
      }
      return prev[lb] <= maxDist;
    }

    // 英文 token 与文本里某个英文词的拼写容错命中（编辑距离 ≤ 1）
    function latinTypoHit(token, text) {
      if (token.length < 4) return false;
      const words = text.match(/[a-z0-9]+/g);
      if (!words) return false;
      for (const w of words) {
        if (Math.abs(w.length - token.length) > 1) continue;
        if (withinEditDistance(token, w, 1)) return true;
      }
      return false;
    }

    // 围绕首个命中词截取摘要，并高亮所有命中词（多词分别高亮）
    function makeSnippet(content, tokens, radius = 60) {
      if (!content) return "";
      const norm = normalizeText(content);

      let idx = -1, hitLen = 0;
      for (const tok of tokens) {
        const i = norm.indexOf(tok);
        if (i !== -1 && (idx === -1 || i < idx)) { idx = i; hitLen = tok.length; }
      }

      let snippet, prefix = false, suffix = false;
      if (idx === -1) {
        snippet = content.slice(0, radius * 2).trim();
      } else {
        const start = Math.max(0, idx - radius);
        const end = Math.min(content.length, idx + hitLen + radius);
        snippet = content.slice(start, end).trim();
        prefix = start > 0;
        suffix = end < content.length;
      }

      // 先在原文上用控制字符占位标记命中词，再转义 HTML，最后替换成 <mark>，
      // 避免高亮正则误伤转义后产生的 HTML 实体（如把 &amp; 里的 amp 高亮）
      const alt = tokens
        .filter(Boolean)
        .sort((a, b) => b.length - a.length)
        .map(escapeRegExp)
        .join("|");
      const markOpen = String.fromCharCode(1), markClose = String.fromCharCode(2);
      let marked = snippet;
      if (alt) {
        marked = snippet.replace(new RegExp(alt, "ig"), m => markOpen + m + markClose);
      }
      const html = escapeHtml(marked)
        .split(markOpen).join("<mark>")
        .split(markClose).join("</mark>");
      return (prefix ? "..." : "") + html + (suffix ? "..." : "");
    }

    const FIELD_SCORE = {
      text: 100,
      ownTitle: 80,
      subsection: 45,
      section: 35,
      docTitle: 15
    };

    const PHRASE_SCORE = {
      text: 50,
      ownTitle: 35,
      subsection: 15,
      section: 15,
      docTitle: 8
    };

    const KIND_SCORE = {
      dxtips: 40,
      definition: 20,
      theorem: 20,
      lemma: 20,
      proposition: 20,
      corollary: 12,
      example: 12,
      remark: 12,
      note: 12
    };

    function hasExplicitBlockTitle(item) {
      const kind = String(item.kind || "").trim();
      if (!kind || !item.rawContent) return false;
      const re = new RegExp("^\\s*\\\\begin\\{" + escapeRegExp(kind) + "\\}\\s*\\[");
      return re.test(item.rawContent);
    }

    function buildSearchFields(item) {
      const title = normalizeText(item.blockTitle || item.previewTitle || "");
      const section = normalizeText(item.section || "");
      const subsection = normalizeText(item.subsection || "");
      const inheritedTitle = title && !hasExplicitBlockTitle(item)
        && (title === section || title === subsection);

      return {
        text: normalizeText(item.text || ""),
        ownTitle: inheritedTitle ? "" : title,
        section,
        subsection,
        docTitle: normalizeText(item.title || item.repo || ""),
        pinyinIni: item.pinyinInitials || "",
        pinyinFull: item.pinyinFull || ""
      };
    }

    // 单个词在一个块上的最佳命中分；0 表示完全未命中
    function tokenFieldScore(token, fields) {
      let best = 0;
      // 子串匹配（中英文统一走子串，符合 CJK 搜索习惯，天然含前缀匹配）
      if (fields.text.includes(token)) best = Math.max(best, FIELD_SCORE.text);
      if (fields.ownTitle.includes(token)) best = Math.max(best, FIELD_SCORE.ownTitle);
      if (fields.subsection.includes(token)) best = Math.max(best, FIELD_SCORE.subsection);
      if (fields.section.includes(token)) best = Math.max(best, FIELD_SCORE.section);
      if (fields.docTitle.includes(token)) best = Math.max(best, FIELD_SCORE.docTitle);
      if (best > 0) return best;
      // 纯字母词：拼音首字母 / 全拼，或英文拼写容错
      if (isLatinToken(token)) {
        if (fields.pinyinIni.includes(token)) return 55;
        if (fields.pinyinFull.includes(token)) return 42;
        if (latinTypoHit(token, fields.ownTitle)
            || latinTypoHit(token, fields.subsection)
            || latinTypoHit(token, fields.section)
            || latinTypoHit(token, fields.docTitle)) return 36;
        if (latinTypoHit(token, fields.text)) return 22;
      }
      return 0;
    }

    function scoreItem(item, tokens, normQuery) {
      const fields = buildSearchFields(item);

      // 多词 AND：每个词都要命中，否则淘汰
      let score = 0;
      for (const tok of tokens) {
        const s = tokenFieldScore(tok, fields);
        if (s === 0) return 0;
        score += s;
      }

      const kind = (item.kind || "").toLowerCase();
      score += KIND_SCORE[kind] || 0;

      // 整个查询作为连续短语命中 → 额外加权（精确短语优先于分散命中）。
      // 正文单字命中过泛，不给短语加分；标题/章节单字命中仍然有较强意图。
      if (normQuery.length >= 2) {
        if (fields.text.includes(normQuery)) score += PHRASE_SCORE.text;
      }
      if (normQuery.length >= 1) {
        if (fields.ownTitle.includes(normQuery)) score += PHRASE_SCORE.ownTitle;
        if (fields.subsection.includes(normQuery)) score += PHRASE_SCORE.subsection;
        if (fields.section.includes(normQuery)) score += PHRASE_SCORE.section;
        if (fields.docTitle.includes(normQuery)) score += PHRASE_SCORE.docTitle;
      }

      const len = (item.text || "").length;
      if (len <= 180) score += 8;
      else if (len <= 320) score += 4;
      else if (len >= 1400) score -= 12;
      else if (len >= 900) score -= 6;

      return score;
    }

    function searchNotes(query) {
      const normQuery = normalizeText(query).trim();
      const tokens = normQuery.split(/\s+/).filter(Boolean);
      if (!tokens.length) return [];

      const sortedResults = searchIndex
        .filter(item => canViewRepo(item.repo))
        .map(item => {
          const score = scoreItem(item, tokens, normQuery);
          if (score < 35) return null;
          return {
            ...item,
            score,
            snippet: makeSnippet(item.text || item.blockTitle || "", tokens)
          };
        })
        .filter(Boolean)
        .sort((a, b) =>
          b.score !== a.score
            ? b.score - a.score
            : String(a.id || "").localeCompare(String(b.id || ""))
        );

      const limited = [];
      const repoCount = new Map();

      for (const item of sortedResults) {
        const repo = item.repo || "unknown";
        const n = repoCount.get(repo) || 0;
        if (n >= 3) continue;
        repoCount.set(repo, n + 1);
        limited.push(item);
        if (limited.length >= 12) break;
      }

      return limited;
    }

    function renderSearchResults(query) {
      const meta = document.getElementById("searchMeta");
      const box = document.getElementById("searchResults");
      const shelf = document.getElementById("bookshelf");
      const trimmed = query.trim();

      if (!trimmed) {
        box.classList.remove("show");
        box.innerHTML = "";
        meta.textContent = "";
        shelf.classList.remove("dimmed");
        return;
      }

      shelf.classList.add("dimmed");
      const results = searchNotes(trimmed);
      box.classList.add("show");

      if (results.length === 0) {
        meta.textContent = "没有找到匹配结果";
        box.innerHTML = `<div class="result-empty">没有找到和 “${escapeHtml(trimmed)}” 对应的内容。</div>`;
        return;
      }

      meta.textContent = `找到 ${results.length} 条结果`;

      box.innerHTML = results.map(item => {
        const title = item.previewTitle || item.blockTitle || item.title || "Untitled";
        const metaText = [item.title].filter(Boolean).join(" · ");
        const page = item.previewClip?.page || item.pdfLocator?.page || 1;
        const href = item.pdf ? `${item.pdf}#page=${page}` : "#";

        const previewHtml = item.previewImage
          ? `<img class="preview-image" src="${escapeHtml(item.previewImage)}" alt="${escapeHtml(title)}" />`
          : `<div class="preview-body">${item.snippet}</div>`;

        return `
          <a class="result-item" href="${escapeHtml(href)}" target="_blank" rel="noreferrer">
            <div class="result-type">${escapeHtml(item.kind || "text")}</div>
            <div class="result-title">${escapeHtml(title)}<\/div>
            <div class="result-meta">${escapeHtml(metaText)} · 第 ${escapeHtml(String(page))} 页<\/div>
            ${previewHtml}
          <\/a>
        `;
      }).join("");
    }

    async function loadBooks() {
      const [booksRes, stateRes] = await Promise.all([
        fetch("/books.json"),
        fetch("/build_state.json").catch(() => null),
      ]);
      if (!booksRes.ok) throw new Error("books.json not found");
      const books = await booksRes.json();
      const state = stateRes?.ok ? await stateRes.json() : {};

      books.sort((a, b) => {
        const ta = state[a.file.replace(/\.pdf$/i, "")] || "";
        const tb = state[b.file.replace(/\.pdf$/i, "")] || "";
        return tb.localeCompare(ta);
      });

      const shelf = document.getElementById("bookshelf");
      shelf.innerHTML = "";

      books
        .filter(book => canViewRepo(book.file.replace(/\.pdf$/i, "")))
        .forEach((book, i) => {
          const color = colors[i % colors.length];
          const title = book.title || formatTitle(book.file);
          const spine = formatUpperSpine(book.file.replace(/\.pdf$/i, ""));
          const desc = book.desc || "Auto-compiled from LaTeX";
          const href = `/pdf/${book.file}`;

          const a = document.createElement("a");
          a.className = "book-item";
          a.href = href;
          a.target = "_blank";

          a.innerHTML = `
            <div class="book" style="background: linear-gradient(180deg, ${color[0]}, ${color[1]});">
              <div class="book-content">
                <div class="book-title">${spine}<\/div>
                <div class="book-footer">${desc}<br>Click to open PDF<\/div>
              <\/div>
            <\/div>
            <div class="book-name">${title}<\/div>
            <div class="book-desc">${book.subtitle || ""}<\/div>
          `;

          shelf.appendChild(a);
        });
    }

    async function loadSearchIndex() {
      try {
        const res = await fetch("/public/search-index.previews.json");
        if (!res.ok) throw new Error("search-index.previews.json not found");
        searchIndex = await res.json();
      } catch (error) {
        console.error("[search] Failed to load search-index.previews.json", error);
        searchIndex = [];
      }
    }

    function bindSearchEvents() {
      const input = document.getElementById("searchInput");
      const shell = document.getElementById("searchShell");

      input.addEventListener("focus", () => shell.classList.add("focused"));
      input.addEventListener("blur", () => shell.classList.remove("focused"));
      let searchDebounce;
      input.addEventListener("input", (e) => {
        const value = e.target.value;
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => renderSearchResults(value), 120);
      });

      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          input.focus();
        }
      });
    }

    function initHeroCarousel() {
      const track = document.getElementById("heroTrack");
      const dotsWrap = document.getElementById("heroDots");
      if (!track || !dotsWrap) return;

      const slides = [...track.querySelectorAll(".hero-slide")];
      const videos = slides.map(slide => slide.querySelector("video")).filter(Boolean);
      if (videos.length === 0) return;

      let current = 0;
      let switching = false;

      dotsWrap.innerHTML = videos
        .map((_, i) => `<span class="hero-dot ${i === 0 ? "active" : ""}"></span>`)
        .join("");

      // 在末尾追加第一张的克隆，实现无缝正向循环
      const cloneSlide = slides[0].cloneNode(true);
      track.appendChild(cloneSlide);
      const cloneVideo = cloneSlide.querySelector("video");
      if (cloneVideo) {
        cloneVideo.muted = true;
        cloneVideo.setAttribute("muted", "");
        cloneVideo.playsInline = true;
      }

      const dots = [...dotsWrap.querySelectorAll(".hero-dot")];

      function updateDots(idx) {
        const i = idx !== undefined ? idx : current;
        dots.forEach((dot, j) => dot.classList.toggle("active", j === i));
      }

      function moveTrack(animated) {
        track.style.transition = animated === false ? "none" : "transform 0.5s ease";
        track.style.transform = `translateX(-${current * 100}%)`;
      }

      function pauseInactive() {
        videos.forEach((video, i) => {
          if (i !== current) video.pause();
        });
        if (cloneVideo) cloneVideo.pause();
      }

      function preloadNext() {
        const nextVideo = videos[(current + 1) % videos.length];
        if (nextVideo) nextVideo.preload = "auto";
      }

      function playCurrent() {
        const video = videos[current];
        if (!video) return;

        moveTrack();
        updateDots();
        pauseInactive();
        preloadNext();

        video.currentTime = 0;
        video.play().catch(err => console.error("[hero] play failed:", err));
      }

      function goTo(index) {
        if (switching) return;
        switching = true;

        if (index >= videos.length) {
          // 滑到克隆的第一张（位置 videos.length），动画向左
          current = videos.length;
          moveTrack();
          updateDots(0);
          if (cloneVideo) { cloneVideo.currentTime = 0; cloneVideo.play().catch(() => {}); }

          // 动画结束后瞬移回真正的第一张
          setTimeout(() => {
            current = 0;
            moveTrack(false);
            requestAnimationFrame(() => requestAnimationFrame(() => {
              track.style.transition = "transform 0.5s ease";
            }));
            if (cloneVideo) cloneVideo.pause();
            videos[0].currentTime = 0;
            videos[0].play().catch(() => {});
            pauseInactive();
            switching = false;
          }, 520);
          return;
        }

        current = ((index % videos.length) + videos.length) % videos.length;
        playCurrent();
        setTimeout(() => { switching = false; }, 350);
      }

      videos.forEach((video, i) => {
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";
        video.autoplay = i === 0;
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");

        video.addEventListener("ended", () => {
          if (i === current) {
            goTo(current + 1);
          }
        });

        video.addEventListener("error", () => {
          console.error(`[hero] video ${i + 1} failed`);
        });
      });

      dots.forEach((dot, i) => {
        dot.addEventListener("click", () => goTo(i));
      });

      playCurrent();

      // 触摸滑动切换
      const carousel = document.getElementById("heroCarousel");
      let touchStartX = 0;
      carousel.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });
      carousel.addEventListener("touchend", (e) => {
        const delta = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(delta) > 40) {
          goTo(delta > 0 ? current + 1 : current - 1);
        }
      }, { passive: true });

      // 触控板横向滑动切换
      let wheelCooling = false;
      carousel.addEventListener("wheel", (e) => {
        e.preventDefault();
        if (wheelCooling) return;
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        if (Math.abs(delta) < 8) return;
        wheelCooling = true;
        goTo(delta > 0 ? current + 1 : current - 1);
        setTimeout(() => { wheelCooling = false; }, 600);
      }, { passive: false });

      // 点击全屏
      carousel.addEventListener("click", (e) => {
        // 点 dot 不触发全屏
        if (e.target.classList.contains("hero-dot")) return;

        const video = videos[current];
        if (!video) return;

        const target = video.requestFullscreen
          ? video
          : carousel;

        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          (target.requestFullscreen || target.webkitRequestFullscreen || target.mozRequestFullScreen).call(target);
        }
      });
    }

    async function init() {
      try {
        updateAdminBtn();
        await loadVisibility();
        await Promise.all([loadBooks(), loadSearchIndex()]);
        bindSearchEvents();
        initHeroCarousel();
      } catch (e) {
        console.error("[init] failed", e);
      }
    }

    init();
  </script>
</body>
</html>
