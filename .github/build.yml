name: Build LaTeX Notes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout website repo
      uses: actions/checkout@v3

    - name: Clone notes repo
      run: |
        git clone https://github.com/yangminggulab/dx-PDE.git

    - name: Compile LaTeX
      uses: xu-cheng/latex-action@v3
      with:
        root_file: 主文件.tex
        working_directory: dx-PDE

    - name: Move PDF to site
      run: |
        mkdir -p pdf
        cp dx-PDE/主文件.pdf pdf/dx-pde.pdf

    - name: Commit PDF
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add pdf/dx-pde.pdf
        git commit -m "update pdf"
        git push
