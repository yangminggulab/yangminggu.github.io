name: Build LaTeX Notes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Cache LaTeX packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: latexmk texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-lang-chinese biber fonts-noto-cjk fonts-noto-cjk-extra
          version: 1.1

      - name: Rebuild XeLaTeX format
        run: fmtutil-user --byfmt xelatex

      - name: Install elegantbook class
        run: |
          mkdir -p ~/texmf/tex/latex/elegantbook
          curl -L https://raw.githubusercontent.com/ElegantLaTeX/ElegantBook/master/elegantbook.cls \
            -o ~/texmf/tex/latex/elegantbook/elegantbook.cls
          texhash ~/texmf

      - name: Run Python build script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_notes.py

      - name: Check synctex generation
        run: |
          echo "=== synctex files in temp_repos ==="
          find temp_repos -name "*.synctex.gz" 2>/dev/null && echo "(listed above)" || echo "NONE FOUND"
          echo "=== notes_manifest.json synctex fields ==="
          python3 -c "
          import json
          m = json.load(open('notes_manifest.json'))
          for item in m:
              s = item.get('synctex')
              exists = __import__('os').path.exists(s) if s else False
              print(f\"  {item['repo']}: synctex={'SET' if s else 'NULL'}, exists={exists}\")
          "

      - name: Build search index
        run: npx tsx scripts/build-search-index.ts

      - name: Enrich search index
        run: npx tsx scripts/enrich-search-index.ts

      - name: Render search previews
        run: python scripts/render_search_previews.py

      - name: Commit updated files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -A index.html pdf books.json build_state.json notes_manifest.json public video/videos.json
          echo "== git status before commit =="
          git status --short
          git commit -m "auto build: update notes and search index" || echo "no changes"
          git pull --rebase origin main
          git push origin main
