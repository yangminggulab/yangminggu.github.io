name: Build LaTeX Notes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Run build script
        run: |
          python scripts/build_notes.py

      - name: Commit updated PDFs
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add pdf/
          git commit -m "update compiled PDFs" || echo "no changes"
          git push
